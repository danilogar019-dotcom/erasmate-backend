spring.application.name=erasmate-backend

# Puerto de Spring (el 8080 lo usa Apache de XAMPP)
server.port=8081

# Conexión a MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/erasmate
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.MariaDBLegacyDialect
spring.jpa.open-in-view=false

# JWT
# Clave secreta para firmar los tokens (mínimo 256 bits, en Base64)
